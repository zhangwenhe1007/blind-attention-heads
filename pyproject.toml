[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blindheads"
version = "0.1.0"
description = "Find the few heads where a sparse attention selector loses retrieval, and fix them without training"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []          # the core (heads, rule, probe arithmetic) is pure Python; see requirements.txt for the models

[tool.setuptools]
packages = ["blindheads", "blindheads.infllm_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
